name: CI

on:
  push:
    branches: [main, phase-12-release]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./ci.db
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:123:web:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Validate one-line Linux installer
        run: |
          bash -n install.sh cyberlab.sh
          CYBERLAB_INSTALL_DRY_RUN=1 bash ./install.sh
          node --check scripts/remote-setup.mjs
      - name: Validate unified Linux bootstrap
        run: bash ./cyberlab.sh doctor --ci
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Create SQLite schema
        run: npx prisma db push --skip-generate
      - name: Seed database
        run: npm run db:seed
      - name: Validate curriculum export
        run: npx tsx scripts/export-manual-data.ts lab-manual-data.json
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test
      - name: Two-user release E2E
        run: npm run test:e2e
      - name: Release structure check
        run: npm run release:check
      - name: Production build
        run: npm run build

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: file:./ci-windows.db
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:123:web:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Validate one-line Windows installer
        shell: pwsh
        run: |
          & .\install.ps1 -DryRun
          node --check scripts/remote-setup.mjs
      - name: Validate unified Windows bootstrap
        run: cmd /c cyberlab.cmd doctor --ci
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Create SQLite schema
        run: npx prisma db push --skip-generate
      - name: Seed database
        run: npm run db:seed
      - name: Unit and integration tests
        run: npm run test
      - name: Two-user release E2E
        run: npm run test:e2e
      - name: Release structure check
        run: npm run release:check
      - name: Production build
        run: npm run build
