name: CI

on:
  push:
    branches: [main, phase-12-release]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.db
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:123:web:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Create SQLite schema
        run: npx prisma db push --skip-generate

      - name: Seed database
        run: npm run db:seed

      - name: Export curriculum data
        run: npx tsx scripts/export-manual-data.ts lab-manual-data.json

      - name: Upload curriculum data
        uses: actions/upload-artifact@v4
        with:
          name: lab-manual-data
          path: lab-manual-data.json
          retention-days: 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
