services:
  db:
    image: postgres:16-alpine
    container_name: cyberlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberlab
      POSTGRES_USER: cyberlab
      POSTGRES_PASSWORD: cyberlab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cyberlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberlab -d cyberlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cyberlab_pgdata:
